<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulating PyQt5 with CSS</title>
    <style>
        /* Add your CSS styles here */
        .window {
            background-color: black;
            width: 300px;
            height: 200px;
            padding: 20px;
            box-sizing: border-box;
        }

        .button {
            background-color: blue;
            color: white;
            font-size: 16px;
            padding: 10px;
            cursor: pointer;
        }

        .button:hover {
            background-color: lightblue;
        }
    </style>
</head>
<body>

<div class="window">
    <button class="button">Click Me</button>
</div>

</body>
</html>
